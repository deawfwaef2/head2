<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画质提升 · 写实头像渲染演示（独立模块）</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eee}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #loading{position:fixed;inset:0;display:grid;place-items:center;font-size:16px;color:#ccc;background:#111;z-index:5}
  #panel{position:fixed;top:14px;right:14px;width:270px;max-height:calc(100% - 28px);overflow:auto;background:rgba(18,18,20,.72);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;z-index:3;font-size:13px}
  body.hidepanel #panel{display:none}
  #panelToggle{position:fixed;top:14px;left:14px;z-index:4;background:rgba(18,18,20,.7);color:#eee;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px}
  #panel h3{margin:0 0 10px;font-size:15px}
  #panel label{display:block;margin:10px 0 4px;color:#aaa}
  #panel select{width:100%;background:#222;color:#eee;border:1px solid #333;border-radius:8px;padding:6px}
  #panel button{width:100%;padding:9px;border-radius:10px;border:0;cursor:pointer;font-weight:700;font-size:13px;margin-top:6px;background:#2c2c30;color:#eee}
  #panel button.on{background:linear-gradient(135deg,#c79a5b,#8a5f34);color:#fff}
  .row{display:flex;align-items:center;gap:8px}.row input{flex:1}.row span{width:36px;text-align:right;color:#ccc;font-variant-numeric:tabular-nums}
  .adv{transition:opacity .2s} body.before .adv{opacity:.35;pointer-events:none}
  .note{color:#888;font-size:11.5px;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">正在加载写实渲染管线…</div>
<button id="panelToggle">☰ 面板</button>
<div id="panel">
  <h3>🎞️ 画质提升 · 独立演示</h3>
  <button id="btnMode" class="on">✨ 画质提升：开</button>
  <label>镜头</label><select id="selView"></select>
  <label>布光</label><select id="selLight" class="adv"></select>
  <label>肤质贴图</label><select id="selSkin"></select>
  <label>眉形</label><select id="selBrow"></select>
  <label>发型</label><select id="selHair"></select>
  <label>发色</label><select id="selHairColor"></select>
  <div class="adv">
    <label>次表面散射（皮肤通透）</label><div class="row"><input type="range" id="sScatter" min="0" max="2" step="0.01" value="1"><span id="sScatterO"></span></div>
    <label>皮肤粗糙度（越低越油亮）</label><div class="row"><input type="range" id="sRough" min="0.3" max="0.8" step="0.01" value="0.5"><span id="sRoughO"></span></div>
    <label>毛孔法线强度</label><div class="row"><input type="range" id="sPore" min="0" max="1.6" step="0.01" value="0.8"><span id="sPoreO"></span></div>
    <label>曝光</label><div class="row"><input type="range" id="sExpo" min="0.6" max="1.6" step="0.01" value="1"><span id="sExpoO"></span></div>
    <label>胶片颗粒</label><div class="row"><input type="range" id="sGrain" min="0" max="0.12" step="0.001" value="0.035"><span id="sGrainO"></span></div>
    <label>暗角</label><div class="row"><input type="range" id="sVig" min="0" max="1" step="0.01" value="0.32"><span id="sVigO"></span></div>
    <label>镜头微对比锐化</label><div class="row"><input type="range" id="sSharp" min="0" max="1.2" step="0.01" value="0.35"><span id="sSharpO"></span></div>
  </div>
  <label>导入高精头模测试（GLB/OBJ + 颜色/法线贴图，可多选）</label><input type="file" id="fileImport" multiple accept=".glb,.gltf,.obj,.jpg,.jpeg,.png,.webp" style="width:100%;color:#aaa">
  <button id="btnBuiltin">↩ 回到内置头模</button>
  <button id="btnShot">📷 保存截图</button>
  <div class="note">本页面是独立的画质研究模块，不连接主项目。鼠标拖动旋转，滚轮缩放。</div>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
