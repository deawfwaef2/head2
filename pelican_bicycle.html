<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹈鹕骑自行车 - 2D SVG 动画</title>
  <style>
    :root {
      --bg-top: #56ccf2;
      --bg-mid: #a8e6cf;
      --bg-bottom: #fff5d6;
      --panel-bg: rgba(255, 255, 255, 0.86);
      --text-main: #1e293b;
      --accent: #ff6b4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #38bdf8 0%, #bae6fd 65%, #fef3c7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .stage-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg#scene {
      width: 100%;
      height: 100%;
      max-width: 1280px;
      max-height: 800px;
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.22);
      background: #87ceeb;
    }

    @media (max-width: 1280px) {
      svg#scene {
        border-radius: 0;
        max-width: 100%;
        max-height: 100%;
      }
    }

    /* 控制栏 */
    .hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      padding: 10px 20px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
    }

    .hud-btn {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
    }

    .hud-btn:hover {
      background: #ff6b4a;
      color: #ffffff;
      border-color: #ff6b4a;
      transform: translateY(-1px);
    }

    .hud-btn:active {
      transform: translateY(0);
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input[type="range"] {
      accent-color: #ff6b4a;
      cursor: pointer;
      width: 100px;
    }

    .title-badge {
      position: absolute;
      top: 22px;
      left: 28px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .title-badge span.dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff6b4a;
      display: inline-block;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }
  </style>
</head>
<body>
  <div class="stage-wrapper">
    <div class="title-badge">
      <span class="dot"></span>
      <span>海滨骑行家 · 鹈鹕与复古单车</span>
    </div>

    <svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 天空渐变 -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="skyStop1" offset="0%" stop-color="#38bdf8" />
          <stop id="skyStop2" offset="62%" stop-color="#bae6fd" />
          <stop id="skyStop3" offset="100%" stop-color="#fef08a" />
        </linearGradient>

        <!-- 海洋渐变 -->
        <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop id="seaStop1" offset="0%" stop-color="#0284c7" />
          <stop id="seaStop2" offset="100%" stop-color="#38bdf8" />
        </linearGradient>

        <!-- 阳光光晕 -->
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fde047" stop-opacity="1" />
          <stop offset="45%" stop-color="#facc15" stop-opacity="0.6" />
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
        </radialGradient>

        <!-- 鹈鹕大嘴喉囊渐变 -->
        <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="20%" y2="100%">
          <stop offset="0%" stop-color="#fb923c" />
          <stop offset="55%" stop-color="#f97316" />
          <stop offset="100%" stop-color="#ea580c" />
        </linearGradient>

        <!-- 鹈鹕上喙渐变 -->
        <linearGradient id="beakTopGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#fde047" />
          <stop offset="70%" stop-color="#f59e0b" />
          <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>

        <!-- 鹈鹕羽毛身体渐变 -->
        <linearGradient id="bodyFeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" />
          <stop offset="70%" stop-color="#f8fafc" />
          <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>

        <!-- 车架金属质感渐变 -->
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff6b4a" />
          <stop offset="50%" stop-color="#ef4444" />
          <stop offset="100%" stop-color="#b91c1c" />
        </linearGradient>

        <!-- 轮胎阴影 -->
        <radialGradient id="groundShadowGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#0f172a" stop-opacity="0.32" />
          <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
        </radialGradient>

        <!-- 车轮复用组件 -->
        <g id="WheelTemplate">
          <!-- 外胎 -->
          <circle cx="0" cy="0" r="76" fill="none" stroke="#1e293b" stroke-width="12" />
          <!-- 复古白边胎壁 -->
          <circle cx="0" cy="0" r="69" fill="none" stroke="#fef3c7" stroke-width="3.5" />
          <!-- 铝圈 -->
          <circle cx="0" cy="0" r="65" fill="none" stroke="#cbd5e1" stroke-width="4" />
          <!-- 辐条 -->
          <g stroke="#94a3b8" stroke-width="1.6">
            <line x1="-64" y1="0" x2="64" y2="0" />
            <line x1="0" y1="-64" x2="0" y2="64" />
            <line x1="-45" y1="-45" x2="45" y2="45" />
            <line x1="-45" y1="45" x2="45" y2="-45" />
            <line x1="-59" y1="-24" x2="59" y2="24" />
            <line x1="-24" y1="-59" x2="24" y2="59" />
            <line x1="-59" y1="24" x2="59" y2="-24" />
            <line x1="-24" y1="59" x2="24" y2="-59" />
          </g>
          <!-- 气门嘴与反光片 -->
          <rect x="-3" y="54" width="6" height="10" rx="2" fill="#f59e0b" />
          <rect x="38" y="-5" width="10" height="10" rx="5" fill="#fb923c" />
          <rect x="-48" y="-5" width="10" height="10" rx="5" fill="#fb923c" />
          <!-- 花鼓 -->
          <circle cx="0" cy="0" r="10" fill="#475569" stroke="#e2e8f0" stroke-width="3" />
        </g>

        <!-- 云朵复用 -->
        <g id="Cloud1" fill="#ffffff" opacity="0.88">
          <path d="M 0,0 Q 15,-22 40,-16 Q 62,-38 95,-20 Q 125,-25 140,-2 Q 160,2 155,20 Q 150,32 125,32 L -10,32 Q -30,32 -25,14 Q -22,-2 0,0 Z" />
        </g>
        <g id="Cloud2" fill="#ffffff" opacity="0.72">
          <path d="M 0,0 Q 12,-15 32,-12 Q 48,-26 70,-12 Q 92,-10 95,8 Q 95,20 75,20 L -5,20 Q -20,20 -16,8 Q -12,-2 0,0 Z" />
        </g>
      </defs>

      <!-- 1. 天空背景 -->
      <rect width="1000" height="620" fill="url(#skyGrad)" />

      <!-- 星星层（夜间模式显现） -->
      <g id="starsLayer" opacity="0" transition="opacity 0.6s">
        <circle cx="120" cy="60" r="1.8" fill="#fff" />
        <circle cx="240" cy="95" r="2.2" fill="#fef08a" />
        <circle cx="390" cy="45" r="1.5" fill="#fff" />
        <circle cx="520" cy="110" r="2" fill="#fff" />
        <circle cx="670" cy="50" r="2.5" fill="#fde047" />
        <circle cx="880" cy="70" r="1.8" fill="#fff" />
        <circle cx="930" cy="140" r="1.5" fill="#fff" />
        <circle cx="70" cy="150" r="2" fill="#fff" />
      </g>

      <!-- 2. 太阳 / 月亮 -->
      <g id="celestialGroup" transform="translate(800, 115)">
        <circle cx="0" cy="0" r="88" fill="url(#sunGlow)" />
        <circle id="sunDisk" cx="0" cy="0" r="42" fill="#fef08a" />
      </g>

      <!-- 3. 远景云朵与海鸥 -->
      <g id="cloudsLayer">
        <use href="#Cloud1" id="cloudA" x="120" y="95" transform="scale(0.9)" />
        <use href="#Cloud2" id="cloudB" x="520" y="65" transform="scale(1.1)" />
        <use href="#Cloud1" id="cloudC" x="860" y="130" transform="scale(0.7)" />
      </g>

      <!-- 远景飞翔海鸥 -->
      <g id="seagullsLayer" stroke="#334155" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path id="gull1" d="M 220,140 Q 232,128 242,138 Q 252,128 264,140" />
        <path id="gull2" d="M 275,160 Q 284,151 292,158 Q 300,151 309,160" />
      </g>

      <!-- 4. 远处海岛与灯塔（缓慢视差移动） -->
      <g id="distantIsland" transform="translate(180, 345)">
        <path d="M -120,40 Q -40,-15 60,5 Q 130,18 190,40 Z" fill="#64748b" opacity="0.35" />
        <!-- 灯塔 -->
        <g transform="translate(35, -32)">
          <polygon points="-8,45 -5,0 5,0 8,45" fill="#f8fafc" />
          <polygon points="-6.5,28 -5.5,14 5.5,14 6.5,28" fill="#ef4444" />
          <rect x="-7" y="-6" width="14" height="6" rx="1" fill="#1e293b" />
          <polygon points="-9,-6 0,-15 9,-6" fill="#ef4444" />
        </g>
      </g>

      <!-- 5. 海洋与动态波浪 -->
      <rect x="0" y="380" width="1000" height="95" fill="url(#seaGrad)" />
      <g id="wavesLayer" opacity="0.55">
        <path id="wavePath1" d="M -200,405 Q -150,395 -100,405 T 0,405 T 100,405 T 200,405 T 300,405 T 400,405 T 500,405 T 600,405 T 700,405 T 800,405 T 900,405 T 1000,405 T 1100,405 T 1200,405" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" />
        <path id="wavePath2" d="M -200,432 Q -140,422 -80,432 T 40,432 T 160,432 T 280,432 T 400,432 T 520,432 T 640,432 T 760,432 T 880,432 T 1000,432 T 1120,432 T 1240,432" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round" />
      </g>

      <!-- 海面帆船 -->
      <g id="sailboat" transform="translate(680, 376)">
        <polygon points="-22,0 22,0 15,9 -15,9" fill="#f8fafc" />
        <polygon points="0,-38 0,-3 -16,-3" fill="#ffffff" />
        <polygon points="3,-34 3,-3 19,-3" fill="#fef08a" />
      </g>

      <!-- 6. 海滨长廊护栏与棕榈树（中景快速视差） -->
      <g id="midgroundScenery">
        <!-- 护栏底座 -->
        <rect x="0" y="458" width="1000" height="18" fill="#e2e8f0" />
        <line x1="0" y1="458" x2="1000" y2="458" stroke="#94a3b8" stroke-width="2" />
        <!-- 动态移动的护栏柱与棕榈树由JS控制平移 -->
        <g id="scrollingProps"></g>
      </g>

      <!-- 7. 公路与路面标线 -->
      <g id="roadLayer">
        <!-- 沙滩边缘 -->
        <rect x="0" y="474" width="1000" height="16" fill="#fde68a" />
        <!-- 沥青骑行道 -->
        <rect x="0" y="488" width="1000" height="132" fill="#334155" />
        <line x1="0" y1="488" x2="1000" y2="488" stroke="#cbd5e1" stroke-width="4" />
        <!-- 地面滚动虚线与小石子 -->
        <g id="roadDashes"></g>
      </g>

      <!-- ============================================================ -->
      <!-- 8. 核心主角：鹈鹕骑复古自行车                                  -->
      <!-- ============================================================ -->
      <g id="pelicanBikeRig" transform="translate(30, 12)">
        <!-- 地面椭圆投影 -->
        <ellipse id="bikeShadow" cx="465" cy="508" rx="195" ry="14" fill="url(#groundShadowGrad)" />

        <!-- 速度线特效（冲刺时显示） -->
        <g id="speedLines" opacity="0" stroke="#ffffff" stroke-linecap="round">
          <line x1="120" y1="260" x2="210" y2="260" stroke-width="3" opacity="0.8" />
          <line x1="80" y1="340" x2="190" y2="340" stroke-width="4" opacity="0.7" />
          <line x1="140" y1="420" x2="220" y2="420" stroke-width="2.5" opacity="0.8" />
        </g>

        <!-- 【A】远端腿（左腿，位于车架后方） -->
        <g id="farLegGroup">
          <!-- 大腿（羽毛） -->
          <line id="farThigh" x1="385" y1="310" x2="430" y2="365" stroke="#cbd5e1" stroke-width="22" stroke-linecap="round" />
          <!-- 小腿（橘色鸟胫） -->
          <line id="farShin" x1="430" y1="365" x2="430" y2="430" stroke="#ea580c" stroke-width="9" stroke-linecap="round" />
          <!-- 膝关节修饰 -->
          <circle id="farKnee" cx="430" cy="365" r="7" fill="#ea580c" />
          <!-- 远端脚掌（蹼足） -->
          <g id="farFoot" transform="translate(430, 430)">
            <path d="M -8,0 L 28,-2 C 34,2 34,9 26,10 L -10,8 Z" fill="#ea580c" />
            <!-- 远端脚踏板 -->
            <rect x="-14" y="6" width="32" height="7" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5" />
          </g>
        </g>

        <!-- 【B】远端曲柄（后方曲柄臂） -->
        <line id="farCrank" x1="430" y1="422" x2="430" y2="450" stroke="#64748b" stroke-width="7" stroke-linecap="round" />

        <!-- 【C】自行车后轮与前轮 -->
        <g id="rearWheel" transform="translate(310, 422)">
          <use href="#WheelTemplate" />
        </g>
        <g id="frontWheel" transform="translate(595, 422)">
          <use href="#WheelTemplate" />
        </g>

        <!-- 【D】自行车车架与传动组件（随车身轻微颠簸） -->
        <g id="bikeFrameGroup">
          <!-- 后轮挡泥板 -->
          <path d="M 226,412 A 84,84 0 0,1 372,366" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" />
          <!-- 前轮挡泥板 -->
          <path d="M 526,374 A 84,84 0 0,1 666,385" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round" />

          <!-- 链条与飞轮 -->
          <g id="drivetrain">
            <!-- 链条上下段 -->
            <line x1="310" y1="411" x2="430" y2="399" stroke="#334155" stroke-width="3.5" stroke-dasharray="6,4" id="chainTop" />
            <line x1="310" y1="433" x2="430" y2="445" stroke="#334155" stroke-width="3.5" stroke-dasharray="6,4" id="chainBottom" />
            <circle cx="310" cy="422" r="12" fill="none" stroke="#475569" stroke-width="4" />
          </g>

          <!-- 主车架几何（复古珊瑚红配色） -->
          <!-- 后下叉 Chainstay -->
          <line x1="310" y1="422" x2="430" y2="422" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round" />
          <!-- 后上叉 Seatstay -->
          <line x1="310" y1="422" x2="382" y2="318" stroke="url(#frameGrad)" stroke-width="8" stroke-linecap="round" />
          <!-- 立管 Seat tube -->
          <line x1="430" y1="422" x2="375" y2="298" stroke="url(#frameGrad)" stroke-width="11" stroke-linecap="round" />
          <!-- 下管 Down tube -->
          <line x1="430" y1="422" x2="542" y2="316" stroke="url(#frameGrad)" stroke-width="12" stroke-linecap="round" />
          <!-- 复古弧形上管 Top tube -->
          <path d="M 382,318 Q 465,302 538,304" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />
          <!-- 头管 Head tube -->
          <line x1="534" y1="292" x2="548" y2="332" stroke="url(#frameGrad)" stroke-width="13" stroke-linecap="round" />
          <!-- 前叉 Front fork -->
          <path d="M 544,325 L 582,408 Q 588,420 595,422" fill="none" stroke="url(#frameGrad)" stroke-width="10" stroke-linecap="round" />

          <!-- 车架高光装饰条 -->
          <line x1="448" y1="405" x2="522" y2="335" stroke="#fef3c7" stroke-width="3" stroke-linecap="round" />

          <!-- 座管与复古皮质坐垫 -->
          <line x1="375" y1="298" x2="365" y2="275" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
          <!-- 坐垫减震弹簧 -->
          <circle cx="352" cy="282" r="5" fill="none" stroke="#64748b" stroke-width="2.5" />
          <!-- 皮坐垫 -->
          <path d="M 332,272 Q 355,266 392,273 C 402,275 400,283 386,283 L 338,284 C 326,284 324,274 332,272 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />

          <!-- 车把立管与燕把 -->
          <path d="M 534,292 L 520,248 Q 517,238 527,236 L 545,236" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" />
          <!-- 弯把向后延伸供翅膀握持 -->
          <path d="M 540,236 Q 515,235 492,252" fill="none" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" />
          <!-- 复古握把套 -->
          <line x1="504" y1="244" x2="484" y2="257" stroke="#78350f" stroke-width="11" stroke-linecap="round" />
          <!-- 车铃铛 -->
          <g id="bikeBell" transform="translate(526, 224)">
            <path d="M -9,4 A 9,9 0 0,1 9,4 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" />
            <rect x="-2" y="4" width="4" height="5" fill="#94a3b8" />
            <!-- 铃声波纹 -->
            <g id="bellRingWaves" opacity="0" stroke="#facc15" stroke-width="2.5" fill="none" stroke-linecap="round">
              <path d="M -14,-4 Q -18,-12 -10,-16" />
              <path d="M 14,-4 Q 18,-12 10,-16" />
              <path d="M -20,-8 Q -25,-18 -14,-24" />
            </g>
          </g>

          <!-- 车头藤编竹篮与里面的小鱼 -->
          <g id="frontBasket" transform="translate(550, 250)">
            <!-- 篮筐固定架 -->
            <line x1="-12" y1="15" x2="4" y2="15" stroke="#64748b" stroke-width="3" />
            <line x1="-6" y1="45" x2="6" y2="45" stroke="#64748b" stroke-width="3" />
            <!-- 竹篮里探出头的小鱼 -->
            <g id="basketFish" transform="translate(22, 2) rotate(22)">
              <path d="M -12,0 Q 0,-10 16,-2 Q 22,-8 26,-10 L 24,0 L 27,8 Q 21,5 16,3 Q 0,10 -12,0 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
              <circle cx="-5" cy="-2" r="2" fill="#0f172a" />
            </g>
            <!-- 藤编篮子主体 -->
            <polygon points="0,0 44,4 38,48 4,48" fill="#d97706" stroke="#92400e" stroke-width="2" stroke-linejoin="round" />
            <!-- 藤编纹理 -->
            <line x1="4" y1="12" x2="42" y2="15" stroke="#b45309" stroke-width="2" />
            <line x1="4" y1="24" x2="40" y2="26" stroke="#b45309" stroke-width="2" />
            <line x1="4" y1="36" x2="39" y2="37" stroke="#b45309" stroke-width="2" />
            <line x1="15" y1="2" x2="13" y2="48" stroke="#b45309" stroke-width="2" />
            <line x1="29" y1="3" x2="26" y2="48" stroke="#b45309" stroke-width="2" />
            <rect x="-3" y="-3" width="49" height="7" rx="3" fill="#f59e0b" stroke="#92400e" stroke-width="1.8" />
          </g>

          <!-- 中轴大齿盘 (Chainring) -->
          <g id="chainringGroup" transform="translate(430, 422)">
            <circle cx="0" cy="0" r="24" fill="#e2e8f0" stroke="#475569" stroke-width="4" stroke-dasharray="5,3" />
            <circle cx="0" cy="0" r="17" fill="none" stroke="#94a3b8" stroke-width="2" />
            <line x1="-17" y1="0" x2="17" y2="0" stroke="#94a3b8" stroke-width="3" />
            <line x1="0" y1="-17" x2="0" y2="17" stroke="#94a3b8" stroke-width="3" />

  <script>
    (function () {
      // ==================== 场景初始化：生成护栏、棕榈树与路面标线 ====================
      const scrollingProps = document.getElementById("scrollingProps");
      const roadDashes = document.getElementById("roadDashes");

      const numPosts = 14;
      const postSpacing = 90;
      const posts = [];

      for (let i = 0; i < numPosts; i++) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const x = i * postSpacing;
        g.setAttribute("transform", `translate(${x}, 430)`);
        g.innerHTML = `
          <rect x="-5" y="0" width="10" height="30" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
          <circle cx="0" cy="-3" r="5" fill="#cbd5e1"/>
        `;
        scrollingProps.appendChild(g);
        posts.push({ el: g, x });
      }

      // 护栏横向连接杆
      const railBar = document.createElementNS("http://www.w3.org/2000/svg", "line");
      railBar.setAttribute("x1", "0");
      railBar.setAttribute("y1", "440");
      railBar.setAttribute("x2", "1000");
      railBar.setAttribute("y2", "440");
      railBar.setAttribute("stroke", "#cbd5e1");
      railBar.setAttribute("stroke-width", "4");
      scrollingProps.appendChild(railBar);

      // 海滨棕榈树（2棵循环）
      const palms = [];
      for (let i = 0; i < 2; i++) {
        const palm = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const x = i * 620 + 250;
        palm.innerHTML = `
          <!-- 树干 -->
          <path d="M 0,460 Q -18,370 12,285 L 24,285 Q -2,370 16,460 Z" fill="#92400e" />
          <!-- 椰树叶 -->
          <g transform="translate(18, 285)" fill="#16a34a">
            <path d="M 0,0 Q -55,-25 -85,15 Q -45,5 0,0 Z" />
            <path d="M 0,0 Q -35,-55 -75,-35 Q -35,-25 0,0 Z" />
            <path d="M 0,0 Q 15,-60 65,-40 Q 25,-25 0,0 Z" />
            <path d="M 0,0 Q 55,-25 85,18 Q 45,6 0,0 Z" />
            <path d="M 0,0 Q 30,10 55,42 Q 18,22 0,0 Z" />
            <circle cx="-4" cy="6" r="6" fill="#78350f" />
            <circle cx="5" cy="8" r="6" fill="#78350f" />
          </g>
        `;
        scrollingProps.appendChild(palm);
        palms.push({ el: palm, x });
      }

      // 路面白色虚线与小石子
      const dashes = [];
      for (let i = 0; i < 10; i++) {
        const d = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const x = i * 120;
        d.innerHTML = `
          <rect x="0" y="548" width="56" height="8" rx="4" fill="#f8fafc" opacity="0.85" />
          <circle cx="30" cy="595" r="2.5" fill="#64748b" />
          <circle cx="85" cy="512" r="2" fill="#475569" />
        `;
        roadDashes.appendChild(d);
        dashes.push({ el: d, x });
      }

      // ==================== 获取动画 DOM 元素 ====================
      const rearWheel = document.getElementById("rearWheel");
      const frontWheel = document.getElementById("frontWheel");
      const chainringGroup = document.getElementById("chainringGroup");
      const bikeFrameGroup = document.getElementById("bikeFrameGroup");
      const pelicanBodyGroup = document.getElementById("pelicanBodyGroup");
      const pelicanHead = document.getElementById("pelicanHead");
      const gularPouchGroup = document.getElementById("gularPouchGroup");
      const tailFeathers = document.getElementById("tailFeathers");
      const scarfTail = document.getElementById("scarfTail");
      const hatRibbon = document.getElementById("hatRibbon");
      const nearWingGroup = document.getElementById("nearWingGroup");
      const nearWingPath = document.getElementById("nearWingPath");
      const nearWingFeathers = document.getElementById("nearWingFeathers");
      const bikeShadow = document.getElementById("bikeShadow");

      // 双腿与曲柄
      const nearCrank = document.getElementById("nearCrank");
      const farCrank = document.getElementById("farCrank");
      const nearThigh = document.getElementById("nearThigh");
      const nearThighOutline = document.getElementById("nearThighOutline");
      const nearShin = document.getElementById("nearShin");
      const nearKnee = document.getElementById("nearKnee");
      const nearFoot = document.getElementById("nearFoot");

      const farThigh = document.getElementById("farThigh");
      const farShin = document.getElementById("farShin");
      const farKnee = document.getElementById("farKnee");
      const farFoot = document.getElementById("farFoot");

      // 背景元素
      const cloudA = document.getElementById("cloudA");
      const cloudB = document.getElementById("cloudB");
      const cloudC = document.getElementById("cloudC");
      const wavePath1 = document.getElementById("wavePath1");
      const wavePath2 = document.getElementById("wavePath2");
      const sailboat = document.getElementById("sailboat");
      const gull1 = document.getElementById("gull1");
      const gull2 = document.getElementById("gull2");
      const pelicanEye = document.getElementById("pelicanEye");
      const eyeBlinkLine = document.getElementById("eyeBlinkLine");
      const bellRingWaves = document.getElementById("bellRingWaves");
      const pouchFish = document.getElementById("pouchFish");
      const basketFish = document.getElementById("basketFish");
      const speedLines = document.getElementById("speedLines");

      // ==================== 逆运动学 (2D Two-Bone IK) 求解器 ====================
      // 给定髋关节 H(hx, hy) 与脚踏板 P(px, py)，大腿长 L1，小腿长 L2，返回膝关节坐标 K(kx, ky)
      function solveLegIK(hx, hy, px, py, L1, L2) {
        const dx = px - hx;
        const dy = py - hy;
        let dist = Math.hypot(dx, dy);
        // 防止超出最大伸展长度
        const maxReach = L1 + L2 - 0.5;
        if (dist > maxReach) {
          dist = maxReach;
        }
        const baseAngle = Math.atan2(dy, dx);
        // 余弦定理求髋部夹角
        const cosAngle = Math.min(1, Math.max(-1, (L1 * L1 + dist * dist - L2 * L2) / (2 * L1 * dist)));
        const hipOffsetAngle = Math.acos(cosAngle);
        // 鹈鹕朝右骑行，膝盖（鸟踝）朝右前方弯曲，取 baseAngle - hipOffsetAngle
        const thighAngle = baseAngle - hipOffsetAngle;
        const kx = hx + L1 * Math.cos(thighAngle);
        const ky = hy + L1 * Math.sin(thighAngle);
        return { kx, ky };
      }

      // ==================== 动画状态变量 ====================
      let isPlaying = true;
      let speedMultiplier = 1.2;
      let crankAngle = 0; // 曲柄旋转弧度
      let wheelAngle = 0; // 车轮角度（度）
      let timeSec = 0;
      let lastTimestamp = performance.now();

      // 互动特效状态
      let bellFishTimer = 0;
      let sprintTimer = 0;
      let cloudX = [120, 520, 860];
      let boatX = 680;

      // 几何常量
      const BB_X = 430; // 五通中轴 X
      const BB_Y = 422; // 五通中轴 Y
      const CRANK_R = 28; // 曲柄半径
      const L1 = 76; // 大腿长度
      const L2 = 78; // 小腿长度

      // ==================== 主循环更新 ====================
      function animate(now) {
        const dt = Math.min(0.05, (now - lastTimestamp) / 1000);
        lastTimestamp = now;

        if (isPlaying) {
          const effectiveSpeed = speedMultiplier * (sprintTimer > 0 ? 2.1 : 1.0);
          timeSec += dt * effectiveSpeed;

          // 曲柄角速度（顺时针旋转，推动自行车向右前进）
          const angularVel = 4.6 * effectiveSpeed;
          crankAngle += angularVel * dt;
          wheelAngle = (crankAngle * 180 / Math.PI) * 1.45;

          // 1. 旋转前后车轮与齿盘
          rearWheel.setAttribute("transform", `translate(310, 422) rotate(${wheelAngle})`);
          frontWheel.setAttribute("transform", `translate(595, 422) rotate(${wheelAngle})`);
          chainringGroup.setAttribute("transform", `translate(${BB_X}, ${BB_Y}) rotate(${(crankAngle * 180) / Math.PI})`);

          // 2. 车身与鹈鹕躯干律动（每踩半圈颠簸一次）
          const bodyBounceY = Math.sin(crankAngle * 2) * 4.5;
          const bodyPitch = Math.cos(crankAngle * 2) * 1.6;
          bikeFrameGroup.setAttribute("transform", `translate(0, ${bodyBounceY * 0.35})`);
          pelicanBodyGroup.setAttribute(
            "transform",
            `translate(0, ${bodyBounceY}) rotate(${bodyPitch}, 375, 260)`
          );
          bikeShadow.setAttribute("rx", (195 - bodyBounceY * 2.5).toFixed(1));

          // 3. 头部、大喉囊、尾羽、围巾的二级物理跟随律动
          const headNod = Math.sin(crankAngle * 2 - 0.7) * 5.5;
          pelicanHead.setAttribute("transform", `translate(26, -116) rotate(${headNod})`);

          // 喉囊果冻感轻微起伏（加上捕鱼时的大幅鼓起）
          let pouchScaleY = 1 + Math.sin(crankAngle * 2 - 1.1) * 0.08;
          let pouchScaleX = 1 - Math.sin(crankAngle * 2 - 1.1) * 0.03;
          if (bellFishTimer > 0) {
            pouchScaleY += Math.sin(bellFishTimer * 18) * 0.18;
            pouchScaleX += Math.cos(bellFishTimer * 18) * 0.08;
          }
          gularPouchGroup.setAttribute("transform", `scale(${pouchScaleX.toFixed(3)}, ${pouchScaleY.toFixed(3)})`);

          // 尾羽摆动
          const tailAngle = Math.sin(crankAngle * 2 - 0.5) * 8;
          tailFeathers.setAttribute("transform", `translate(308, 252) rotate(${tailAngle})`);

          // 围巾与帽带随风飘扬
          const windWave = Math.sin(timeSec * 9) * 5;
          scarfTail.setAttribute(
            "d",
            `M -16,2 Q -52,${-8 + windWave} -78,${6 - windWave} Q -92,${14 + windWave} -105,${4 + windWave * 1.2} L -98,${18 + windWave} Q -76,${26 - windWave} -50,${14 + windWave} Q -28,6 -12,10 Z`
          );
          hatRibbon.setAttribute("d", `M -13,-1 Q -28,${-6 + windWave * 0.6} -36,${2 - windWave * 0.8}`);

          // 竹篮里的小鱼晃动
          const fishBob = Math.sin(crankAngle * 2 + 0.5) * 6;
          basketFish.setAttribute("transform", `translate(22, ${2 + fishBob * 0.3}) rotate(${22 + fishBob})`);

          // 4. 计算近端脚踏板与远端脚踏板坐标，并用 IK 求解双腿关节
          const nearPedalX = BB_X + CRANK_R * Math.cos(crankAngle);
          const nearPedalY = BB_Y + CRANK_R * Math.sin(crankAngle);

          const farPedalX = BB_X + CRANK_R * Math.cos(crankAngle + Math.PI);
          const farPedalY = BB_Y + CRANK_R * Math.sin(crankAngle + Math.PI);

          // 更新曲柄连杆
          nearCrank.setAttribute("x2", nearPedalX.toFixed(1));
          nearCrank.setAttribute("y2", nearPedalY.toFixed(1));
          farCrank.setAttribute("x2", farPedalX.toFixed(1));
          farCrank.setAttribute("y2", farPedalY.toFixed(1));

          // 近端髋关节位置（随身体浮动）
          const nearHipX = 366;
          const nearHipY = 286 + bodyBounceY;
          const nearIK = solveLegIK(nearHipX, nearHipY, nearPedalX, nearPedalY, L1, L2);

          nearThigh.setAttribute("x1", nearHipX);
          nearThigh.setAttribute("y1", nearHipY.toFixed(1));
          nearThigh.setAttribute("x2", nearIK.kx.toFixed(1));
          nearThigh.setAttribute("y2", nearIK.ky.toFixed(1));

          nearThighOutline.setAttribute("x1", nearHipX);
          nearThighOutline.setAttribute("y1", nearHipY.toFixed(1));
          nearThighOutline.setAttribute("x2", nearIK.kx.toFixed(1));
          nearThighOutline.setAttribute("y2", nearIK.ky.toFixed(1));

          nearShin.setAttribute("x1", nearIK.kx.toFixed(1));
          nearShin.setAttribute("y1", nearIK.ky.toFixed(1));
          nearShin.setAttribute("x2", nearPedalX.toFixed(1));
          nearShin.setAttribute("y2", nearPedalY.toFixed(1));

          nearKnee.setAttribute("cx", nearIK.kx.toFixed(1));
          nearKnee.setAttribute("cy", nearIK.ky.toFixed(1));

          // 脚掌随踩踏相位微微翘起/下压，保持踏板水平
          const nearAnkleTilt = Math.sin(crankAngle) * 8;
          nearFoot.setAttribute(
            "transform",
            `translate(${nearPedalX.toFixed(1)}, ${nearPedalY.toFixed(1)}) rotate(${nearAnkleTilt.toFixed(1)})`
          );

          // 远端髋关节位置與远端腿 IK
          const farHipX = 378;
          const farHipY = 284 + bodyBounceY;
          const farIK = solveLegIK(farHipX, farHipY, farPedalX, farPedalY, L1, L2);

          farThigh.setAttribute("x1", farHipX);
          farThigh.setAttribute("y1", farHipY.toFixed(1));
          farThigh.setAttribute("x2", farIK.kx.toFixed(1));
          farThigh.setAttribute("y2", farIK.ky.toFixed(1));

          farShin.setAttribute("x1", farIK.kx.toFixed(1));
          farShin.setAttribute("y1", farIK.ky.toFixed(1));
          farShin.setAttribute("x2", farPedalX.toFixed(1));
          farShin.setAttribute("y2", farPedalY.toFixed(1));

          farKnee.setAttribute("cx", farIK.kx.toFixed(1));
          farKnee.setAttribute("cy", farIK.ky.toFixed(1));

          const farAnkleTilt = Math.sin(crankAngle + Math.PI) * 8;
          farFoot.setAttribute(
            "transform",
            `translate(${farPedalX.toFixed(1)}, ${farPedalY.toFixed(1)}) rotate(${farAnkleTilt.toFixed(1)})`
          );

          // 5. 近端翅膀肩部随身体浮动，翅尖始终稳握车把 (492, 252)
          const shoulderY = 220 + bodyBounceY;
          const gripY = 250 + bodyBounceY * 0.35;
          nearWingPath.setAttribute(
            "d",
            `M 378,${shoulderY.toFixed(1)}
             C 402,${(shoulderY - 15).toFixed(1)} 445,${(shoulderY - 2).toFixed(1)} 492,${gripY.toFixed(1)}
             C 502,${(gripY + 6).toFixed(1)} 496,${(gripY + 16).toFixed(1)} 482,${(gripY + 14).toFixed(1)}
             C 448,${(shoulderY + 38).toFixed(1)} 422,${(shoulderY + 42).toFixed(1)} 392,${(shoulderY + 34).toFixed(1)}
             C 372,${(shoulderY + 28).toFixed(1)} 365,${(shoulderY + 10).toFixed(1)} 378,${shoulderY.toFixed(1)} Z`
          );
          nearWingFeathers.setAttribute(
            "d",
            `M 435,${(shoulderY + 35).toFixed(1)} Q 465,${(gripY + 8).toFixed(1)} 490,${(gripY + 2).toFixed(1)} M 420,${(shoulderY + 29).toFixed(1)} Q 455,${(gripY + 1).toFixed(1)} 485,${(gripY - 5).toFixed(1)}`
          );

          // 6. 视差滚动：地面虚线、护栏柱、棕榈树、海浪与云朵
          const groundScrollSpeed = 240 * effectiveSpeed;

          dashes.forEach((d) => {
            d.x -= groundScrollSpeed * dt;
            if (d.x < -120) d.x += 1200;
            d.el.setAttribute("transform", `translate(${d.x.toFixed(1)}, 0)`);
          });

          posts.forEach((p) => {
            p.x -= groundScrollSpeed * 0.65 * dt;
            if (p.x < -60) p.x += numPosts * postSpacing;
            p.el.setAttribute("transform", `translate(${p.x.toFixed(1)}, 430)`);
          });

          palms.forEach((palm) => {
            palm.x -= groundScrollSpeed * 0.55 * dt;
            if (palm.x < -150) palm.x += 1240;
            palm.el.setAttribute("transform", `translate(${palm.x.toFixed(1)}, 0)`);
          });

          // 海浪轻柔水平往复
          const waveShift1 = (timeSec * 35) % 200;
          const waveShift2 = (timeSec * 22) % 240;
          wavePath1.setAttribute("transform", `translate(${-waveShift1.toFixed(1)}, 0)`);
          wavePath2.setAttribute("transform", `translate(${-waveShift2.toFixed(1)}, 0)`);

          // 远景帆船与云朵缓慢移动
          boatX -= 12 * effectiveSpeed * dt;
          if (boatX < -60) boatX = 1060;
          const boatRock = Math.sin(timeSec * 3) * 3;
          sailboat.setAttribute("transform", `translate(${boatX.toFixed(1)}, 376) rotate(${boatRock.toFixed(1)})`);

          cloudX[0] = (cloudX[0] - 10 * dt + 1250) % 1250;
          cloudX[1] = (cloudX[1] - 15 * dt + 1250) % 1250;
          cloudX[2] = (cloudX[2] - 8 * dt + 1250) % 1250;
          cloudA.setAttribute("x", cloudX[0] - 180);
          cloudB.setAttribute("x", cloudX[1] - 180);
          cloudC.setAttribute("x", cloudX[2] - 180);

          // 海鸥扇翅
          const flap = Math.sin(timeSec * 7) * 9;
          gull1.setAttribute("d", `M 220,${140 + flap} Q 232,128 242,138 Q 252,128 264,${140 + flap}`);
          gull2.setAttribute("d", `M 275,${160 - flap * 0.7} Q 284,151 292,158 Q 300,151 309,${160 - flap * 0.7}`);

          // 7. 自然眨眼逻辑
          const blinkCycle = timeSec % 4.2;
          if (blinkCycle > 4.02) {
            pelicanEye.setAttribute("opacity", "0");
            eyeBlinkLine.setAttribute("opacity", "1");
          } else {
            pelicanEye.setAttribute("opacity", "1");
            eyeBlinkLine.setAttribute("opacity", "0");
          }

          // 8. 车铃与喉囊跳跳鱼动画计时
          if (bellFishTimer > 0) {
            bellFishTimer = Math.max(0, bellFishTimer - dt);
            bellRingWaves.setAttribute("opacity", (Math.sin(bellFishTimer * 35) > 0 ? 1 : 0.2).toString());
            const jumpProgress = 1 - bellFishTimer / 1.4;
            const arcY = -Math.sin(jumpProgress * Math.PI) * 38;
            const fishRot = (jumpProgress - 0.5) * 55;
            pouchFish.setAttribute("opacity", "1");
            pouchFish.setAttribute("transform", `translate(62, ${(10 + arcY).toFixed(1)}) rotate(${fishRot.toFixed(1)}) scale(0.95)`);
          } else {
            bellRingWaves.setAttribute("opacity", "0");
            pouchFish.setAttribute("opacity", "0");
          }

          // 9. 冲刺状态计时
          if (sprintTimer > 0) {
            sprintTimer = Math.max(0, sprintTimer - dt);
            speedLines.setAttribute("opacity", "1");
          } else {
            speedLines.setAttribute("opacity", "0");
          }
        }

        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);

      // ==================== 交互按钮绑定 ====================
      const togglePlayBtn = document.getElementById("togglePlayBtn");
      const speedRange = document.getElementById("speedRange");
      const bellFishBtn = document.getElementById("bellFishBtn");
      const sprintBtn = document.getElementById("sprintBtn");
      const themeBtn = document.getElementById("themeBtn");

      togglePlayBtn.addEventListener("click", () => {
        isPlaying = !isPlaying;
        togglePlayBtn.textContent = isPlaying ? "⏸ 暂停" : "▶ 继续";
      });

      speedRange.addEventListener("input", (e) => {
        speedMultiplier = parseFloat(e.target.value);
      });

      bellFishBtn.addEventListener("click", () => {
        bellFishTimer = 1.4;
      });

      sprintBtn.addEventListener("click", () => {
        sprintTimer = 2.2;
      });

      // 点击画布上的鹈鹕或车铃也可触发互动
      document.getElementById("pelicanBikeRig").addEventListener("click", () => {
        bellFishTimer = 1.4;
      });

      // 时段主题切换：晴日 -> 晚霞 -> 星夜
      const themes = [
        {
          name: "晴日",
          sky: ["#38bdf8", "#bae6fd", "#fef08a"],
          sea: ["#0284c7", "#38bdf8"],
          sunColor: "#fef08a",
          stars: "0",
          bodyBg: "linear-gradient(180deg, #38bdf8 0%, #bae6fd 65%, #fef3c7 100%)"
        },
        {
          name: "晚霞",
          sky: ["#7c2d12", "#f97316", "#fde047"],
          sea: ["#431407", "#ea580c"],
          sunColor: "#fb923c",
          stars: "0.35",
          bodyBg: "linear-gradient(180deg, #7c2d12 0%, #f97316 65%, #fde047 100%)"
        },
        {
          name: "星夜",
          sky: ["#0f172a", "#1e293b", "#334155"],
          sea: ["#020617", "#0f172a"],
          sunColor: "#f8fafc",
          stars: "1",
          bodyBg: "linear-gradient(180deg, #0f172a 0%, #1e293b 65%, #334155 100%)"
        }
      ];
      let currentTheme = 0;

      themeBtn.addEventListener("click", () => {
        currentTheme = (currentTheme + 1) % themes.length;
        const t = themes[currentTheme];
        document.getElementById("skyStop1").setAttribute("stop-color", t.sky[0]);
        document.getElementById("skyStop2").setAttribute("stop-color", t.sky[1]);
        document.getElementById("skyStop3").setAttribute("stop-color", t.sky[2]);
        document.getElementById("seaStop1").setAttribute("stop-color", t.sea[0]);
        document.getElementById("seaStop2").setAttribute("stop-color", t.sea[1]);
        document.getElementById("sunDisk").setAttribute("fill", t.sunColor);
        document.getElementById("starsLayer").setAttribute("opacity", t.stars);
        document.body.style.background = t.bodyBg;
      });
    })();
  </script>
</body>
</html>
