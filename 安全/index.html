<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写实收藏胸像 · 桌宠工作室（安全版）</title>
<!--__STYLE__-->
</head>
<body>
<canvas id="c"></canvas>
<div id="petDesk"><div class="icons"><div>此电脑</div><div>文档</div><div>回收站</div></div><div class="taskbar"></div></div>
<div id="petWin"><div id="petBar"><button data-pet="spin">⟳ 转身</button><button data-pet="smaller">－</button><button data-pet="bigger">＋</button><button data-pet="exit">✕ 返回</button></div><div id="petBubble"></div><div id="petName"></div></div>

<div id="start">
  <h1>写实<b>收藏胸像</b></h1>
  <p>生成 · 管理 · 设置 · 桌宠 —— 摄影级布光与胶片调色</p>
  <button id="btnStart">▶ 点击开始</button>
  <div class="bar"><i id="startBar"></i></div>
  <div id="startStatus">正在准备渲染管线…</div>
</div>

<div id="tools">
  <button id="btnUI" title="隐藏/显示面板">☰</button>
  <button id="btnAB" class="opt" title="对比原始渲染">A/B 对比</button>
  <button id="btnShot" class="opt">📷 截图</button>
</div>
<div id="top">
  <button data-tab="studio" class="on">🎨 工坊</button>
  <button data-tab="gallery">🗂 收藏</button>
  <button data-tab="pet">🖥 桌宠</button>
  <button data-tab="settings">⚙️ 设置</button>
</div>

<div class="panel on" id="p-studio"></div>
<div class="panel" id="p-gallery"></div>
<div class="panel" id="p-settings"></div>
<div id="abLabel"></div>
<div id="busy"></div>
<div id="toast"></div>
<!--__EMBEDDED_ASSETS__-->
<script type="module" src="./src/main.js"></script>
</body>
</html>
